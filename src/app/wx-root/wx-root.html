
<div class="Container">
    <div class="Header">
        <h1>Hero App</h1>
    </div>
    <div class="Add-Hero">
        <input type="text" [(ngModel)]="inputName" placeholder="Hero Name" >
        <input type="text" [(ngModel)]="inputPower" placeholder="Hero Power">
        <input type="text" [(ngModel)]="inputImageUrl" placeholder="Hero img url">
        <button (click)="addHero()">Add Hero</button>
    </div>
    <div class="Cards">
        <div *ngFor="let hero of AddHero" [ngStyle]="StylesCard">
            <img src="{{hero.imageUrl}}" alt="{{hero.name}}">
            <h2>N. {{hero.name}}</h2>
            <h3>P. {{hero.power}} K</h3>
        </div>
    </div>
</div>
